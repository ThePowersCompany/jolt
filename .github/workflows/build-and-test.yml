name: CI

on: pull_request

permissions:
  id-token: write
  contents: read
  checks: read

env:
  HUSKY: 0

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run type-check

      - name: Prettier check
        run: npx prettier --ignore-unknown --check .

  tests:
    runs-on: ubuntu-latest
    name: Run Tests
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Jolt tests
        run: zig build test --summary all

  build-test-server-image:
    name: Build Zig server Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: server
          tags: ghcr.io/thepowerscompany/jolt-test-server:dev
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          outputs: type=docker,dest=/tmp/jolt-test-server.tar
      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-jolt-test-server
          path: /tmp/jolt-test-server.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  end-to-end-tests:
    runs-on: ubuntu-latest
    name: E2E Tests
    needs: build-test-server-image
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: ./tests/package-lock.json

      - name: Install dependencies and build
        run: cd tests && npm ci

      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: docker-jolt-test-server

      - name: Run test server in background
        run: |
          docker load --input ./jolt-test-server.tar
          docker run --detach --network host \
            --name jolt_test_server \
            ghcr.io/thepowerscompany/jolt-test-server:dev

      - name: Wait for Zig server
        run: |
          if curl --retry 5 --max-time 5 --retry-max-time 30 --retry-all-errors --silent --fail http://localhost:3333/ping; then
            echo "Server is running"
          else
            echo "Server failed to start"
            exit 1
          fi

      - name: Run server tests
        run: cd tests && npm run all-tests

      - name: Capture Zig server logs
        if: always()
        run: |
          docker logs jolt_test_server
          docker logs jolt_test_server &> jolt_test_server.log
          docker rm --force jolt_test_server

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: jolt_test_server.log
          path: jolt_test_server.log
          retention-days: 7
          compression-level: 9
